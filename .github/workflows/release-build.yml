name: Release build

# Maintainer-triggered signed + notarized build (direct-download channel).
# Opt-in: workflow_dispatch from Actions tab. Never runs on push/PR/tag —
# publishing stays a deliberate act (AGENTS.md: release builds are not
# driven by a tracked push workflow; this job only packages, it does NOT
# publish: no GitHub Release, no appcast update, no reactions ritual —
# those stay with the maintainer's local scripts).
#
# Notarization uses an app-specific password (same route as TransFrame),
# not an App Store Connect API key — the latter needs the Account Holder.
#
# SECURITY: this job executes scripts/build.sh from the checked-out ref
# while Developer ID / Apple credentials are present. The `release`
# environment (Settings → Environments → New environment "release" →
# Required reviewers → the owner) gates every run: a dispatch is queued
# until a reviewer approves, so an arbitrary feature ref cannot reach the
# secrets without an explicit human approval on that run. Do not remove
# the environment gate or broaden who can approve it.
#
# Required secrets (repo or `release` environment level):
#   MAC_SIGNING_P12         base64 of the PKCS#12 export of the
#                           "Developer ID Application: ..." identity
#                           (cert + private key)
#   MAC_SIGNING_P12_PASSWORD  password used when creating the .p12
#   APPLE_ID                Apple ID of a team member with notary
#                           access (the one used for the app password)
#   APPLE_APP_PASSWORD      app-specific password for that Apple ID
#                           (account.apple.com → Sign-In and Security
#                           → App-Specific Passwords; NOT the account
#                           password)
#   SPARKLE_PRIVATE_KEY     (optional) base64 of the Sparkle EdDSA
#                           private key file (~/.config/miaoyan/
#                           sparkle_private_key). Without it the zip is
#                           built and notarized but carries no
#                           sparkle:edSignature — fine for a QA artifact,
#                           required before the zip feeds the appcast.
#
# The Apple ID must be a member of team 27LU47J28S with a role that can
# submit notarization (any paid-team role works; no Account Holder).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / tag to build (approved refs only — the release environment gates the run)"
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-notarized-build:
    name: Sign + notarize (direct download)
    runs-on: macos-15
    timeout-minutes: 40
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.3.app/Contents/Developer
      SIGN_IDENTITY: "Developer ID Application: Chengdu Chunfenshijie Technology Co.,Ltd. (27LU47J28S)"
      TEAM_ID: "27LU47J28S"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Fail fast on missing secrets
        env:
          MAC_SIGNING_P12: ${{ secrets.MAC_SIGNING_P12 }}
          MAC_SIGNING_P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          missing=0
          for s in MAC_SIGNING_P12 MAC_SIGNING_P12_PASSWORD APPLE_ID APPLE_APP_PASSWORD; do
            if [ -z "${!s}" ]; then echo "::error::$s secret not set (see workflow header)"; missing=1; fi
          done
          [ "$missing" -eq 0 ]

      - name: Validate version triplet
        # ci.yml's version-consistency job only runs on V* tags; a manual
        # dispatch must not package a drifted tree (V3.5.1 / #524 incident).
        run: |
          set -euo pipefail
          MARKETING=$(grep 'MARKETING_VERSION = ' MiaoYan.xcodeproj/project.pbxproj | sed -E 's/.*MARKETING_VERSION = ([^;]+);.*/\1/' | tr -d ' ' | sort -u)
          PROJECT=$(grep 'CURRENT_PROJECT_VERSION = ' MiaoYan.xcodeproj/project.pbxproj | sed -E 's/.*CURRENT_PROJECT_VERSION = ([^;]+);.*/\1/' | tr -d ' ' | sort -u)
          printf 'MARKETING_VERSION values:\n%s\nCURRENT_PROJECT_VERSION values:\n%s\n' "$MARKETING" "$PROJECT"
          fail=0
          while IFS= read -r v; do
            [ -n "$v" ] || continue
            if [ "$v" != "$(head -1 <<<"$MARKETING")" ]; then echo "::error::MARKETING_VERSION drift: $v"; fail=1; fi
          done <<<"$MARKETING"
          while IFS= read -r v; do
            [ -n "$v" ] || continue
            if [ "$v" != "$(head -1 <<<"$PROJECT")" ]; then echo "::error::CURRENT_PROJECT_VERSION drift: $v"; fail=1; fi
          done <<<"$PROJECT"
          if [ "$(head -1 <<<"$MARKETING")" != "$(head -1 <<<"$PROJECT")" ]; then
            echo "::error::MARKETING_VERSION != CURRENT_PROJECT_VERSION"
            fail=1
          fi
          case "$GITHUB_REF" in
            refs/tags/V*)
              TAG="${GITHUB_REF_NAME#V}"
              if [ "$(head -1 <<<"$MARKETING")" != "$TAG" ]; then
                echo "::error::version $(head -1 <<<"$MARKETING") != tag $TAG"
                fail=1
              fi
              ;;
          esac
          [ "$fail" -eq 0 ]

      - name: Validate release script capability
        # The ref's scripts/build.sh must carry the signed+notarized
        # pipeline (Developer ID identity + MDOWN_NOTARY_PROFILE). Older
        # refs ad-hoc sign and never submit to Apple — packaging those
        # would silently produce an unsigned, unnotarized zip.
        run: |
          set -euo pipefail
          if ! grep -q 'MDOWN_NOTARY_PROFILE' scripts/build.sh || ! grep -q 'MDOWN_SIGN_IDENTITY' scripts/build.sh; then
            echo "::error::scripts/build.sh on this ref lacks the signed/notarized pipeline (see scripts/build.sh [4.5/6]); pick a ref that includes it"
            exit 1
          fi

      - name: Show toolchain
        run: xcodebuild -version

      - name: Import signing identity
        env:
          MAC_SIGNING_P12: ${{ secrets.MAC_SIGNING_P12 }}
          MAC_SIGNING_P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$MAC_SIGNING_P12" | base64 --decode > signing.p12
          # Temporary keychain: created, used, destroyed within this job.
          security create-keychain -p build build.keychain-db
          security set-keychain-settings -lut 21600 build.keychain-db
          security unlock-keychain -p build build.keychain-db
          security import signing.p12 -k build.keychain-db \
            -P "$MAC_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k build build.keychain-db
          security list-keychains -d user -s build.keychain-db \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning build.keychain-db
          rm -f signing.p12

      - name: Provision Sparkle key (optional)
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$SPARKLE_PRIVATE_KEY" ]; then
            mkdir -p "$HOME/.config/miaoyan"
            echo "$SPARKLE_PRIVATE_KEY" | base64 --decode > "$HOME/.config/miaoyan/sparkle_private_key"
            chmod 600 "$HOME/.config/miaoyan/sparkle_private_key"
            echo "Sparkle EdDSA key provisioned (zip will carry sparkle:edSignature)"
          else
            echo "::warning::SPARKLE_PRIVATE_KEY not set — zip will have no sparkle:edSignature (QA artifact only)"
          fi

      - name: Build, sign and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          # notarytool on CI uses an app-specific password instead of a
          # keychain profile; store-credentials validates it right here.
          xcrun notarytool store-credentials mdown-notary-ci \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"
          # build.sh defaults to the same Developer ID identity; point its
          # notary step at the CI profile and keep everything else intact.
          # It finishes by moving zip/dmg into ~/Downloads (its release
          # contract) — the upload step reads them from there.
          MDOWN_NOTARY_PROFILE=mdown-notary-ci bash scripts/build.sh

      - name: Verify stapled ticket
        run: |
          set -euo pipefail
          xcrun stapler validate "./build/Release/Mdown.app"
          spctl -a -t exec -vv "./build/Release/Mdown.app"

      - name: Stage artifacts
        # build.sh's release contract moves zip/dmg into ~/Downloads; copy
        # them into the workspace so upload-artifact (workspace-relative
        # paths, no ~ expansion) can pick them up.
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "$HOME"/Downloads/Mdown_V*.zip artifacts/
          cp "$HOME"/Downloads/Mdown.dmg artifacts/
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdown-signed-notarized
          path: |
            artifacts/Mdown_V*.zip
            artifacts/Mdown.dmg
          retention-days: 14
          if-no-files-found: error

      - name: Cleanup keys
        if: always()
        run: rm -rf "$HOME/.config/miaoyan"
